name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/newsmail-backend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/newsmail-backend:latest ./Backend
          docker push $ECR_REGISTRY/newsmail-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/newsmail-backend:latest

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=https://newsmail.nevinbali.me/api \
            -t $ECR_REGISTRY/newsmail-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/newsmail-frontend:latest ./frontend
          docker push $ECR_REGISTRY/newsmail-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/newsmail-frontend:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster newsmail-cluster \
            --service newsmail-backend-service \
            --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster newsmail-cluster \
            --service newsmail-frontend-service \
            --force-new-deployment